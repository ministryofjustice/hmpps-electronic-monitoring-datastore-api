hmpps-auth:
  url: "http://localhost:8090/auth"

hmpps.sqs:
  provider: localstack
  useWebToken: false
  queues:
    audit:
      queueName: "audit"

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create

  datasource:
    url: 'jdbc:postgresql://${DB_SERVER:localhost:5432}/${DB_NAME:query-db}?sslmode=prefer'
    username: ${DB_USER:query-db}
    password: ${DB_PASS:query-db}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

datastore:
  database: ${ATHENA_DATABASE_NAME:historic_api_mart}
  output-bucket-arn: ${ATHENA_OUTPUT_BUCKET:s3://emds-test-athena-query-results-20240923095933297100000013}
